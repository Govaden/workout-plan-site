.row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}

main{padding:12px;max-width:640px;margin:0 auto}

a{color:var(--tx);font-weight:600;margin-right:14px;font-size:.93em}

textarea{width:100%;box-sizing:border-box;min-height:70px;border-radius:8px;border:2px solid var(--ln);background:var(--bg);color:var(--tx);padding:8px;margin-top:6px}

.bar{display:block;height:8px;border-radius:4px;background:var(--ln);overflow:hidden;margin-top:6px}

#st{font-size:.85em;color:#cfd4da;margin-top:6px}

img.ph{width:100%;max-height:70vh;object-fit:contain;background:var(--bg);border-radius:8px;margin:6px 0;display:block}

#tb{position:fixed;left:0;right:0;bottom:0;background:var(--hd);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));font-weight:600}
#tb[hidden]{display:none}
#tnb{width:auto;padding:0 10px;background:var(--ac);color:var(--on);font-size:.85em}#tnb[hidden]{display:none}
